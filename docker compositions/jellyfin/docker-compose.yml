---
volumes:
  config:
services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 106  # 'render', but this group does not exist in the container
      - video
    ports:
      - name: http
        host_ip: 192.168.1.42
        published: 8096
        target: 8096
      - name: https
        host_ip: 192.168.1.42
        published: 8920
        target: 8920
      - name: client discovery
        host_ip: 192.168.1.42
        published: 7359
        target: 7359
        protocol: udp
    volumes:
      - config:/config
      - target: /cache
        type: tmpfs
        tmpfs:
          mode: 0o01777
      - source: /tank/media
        target: /media
        type: bind
        read_only: true
    restart: unless-stopped
